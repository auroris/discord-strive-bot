[package]
name = "discord-strive-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.2"
hex = "0.4.3"
reqwest = { version = "0.13.2", features = ["blocking", "json", "multipart"] }
anyhow = "1.0.101"
fork = "0.6"

[[bin]]
name = "cgi-handler"
path = "src/bin/cgi_handler.rs"

[[bin]]
name = "callback-handler"
path = "src/bin/callback_handler.rs"

[[bin]]
name = "context-manager"
path = "src/bin/context_manager.rs"

[lib]
name = "discord_strive"
path = "src/lib.rs"